# SPDX-License-Identifier: GPL-3.0-or-later

name: iOS Build

on:
  push:
    branches: [ main ]

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Verify publication ownership
        shell: bash
        run: |
          set -euo pipefail
          release=.github/workflows/publish-release.yml
          grep -Fq 'workflow_run:' "$release"
          grep -Fq 'run-id: ${{ github.event.workflow_run.id }}' "$release"
          grep -Fq 'actions/download-artifact@' "$release"
          if grep -Eq 'head_commit.message|xcodebuild|DEVELOPER_DIR' "$release"; then
            echo "Publication must consume the qualifying IPA without a second build or commit-prose controls." >&2
            exit 1
          fi

      - name: Validate application resources
        shell: bash
        run: |
          set -euo pipefail
          icon="CharacterProfiler/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          manifest="CharacterProfiler/Assets.xcassets/AppIcon.appiconset/Contents.json"

          test -s "$icon"
          test -s "$manifest"
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("CharacterProfiler/Assets.xcassets/AppIcon.appiconset/Contents.json").read_text())
          images = manifest.get("images", [])
          assert any(item.get("filename") == "AppIcon-1024.png" and item.get("size") == "1024x1024" for item in images)
          PY

          width="$(sips -g pixelWidth "$icon" | awk '/pixelWidth/ {print $2}')"
          height="$(sips -g pixelHeight "$icon" | awk '/pixelHeight/ {print $2}')"
          alpha="$(sips -g hasAlpha "$icon" | awk '/hasAlpha/ {print $2}')"
          [[ "$width" == "1024" && "$height" == "1024" ]]
          [[ "$alpha" == "no" ]]

      - name: Verify pinned Xcode version
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          version="$(xcodebuild -version)"
          printf '%s\n' "$version"
          grep -q '^Xcode 16\.4$' <<<"$version"

      - name: Prepare iOS Simulator
        shell: bash
        run: |
          set -euo pipefail

          xcrun simctl list devices available >"$RUNNER_TEMP/available-simulators.txt"
          cat "$RUNNER_TEMP/available-simulators.txt"

          simulator_id="$(grep -m1 -E 'iPhone .*[0-9A-Fa-f-]{36}' "$RUNNER_TEMP/available-simulators.txt" | grep -oE '[0-9A-Fa-f-]{36}' | head -1 || true)"

          if [[ -z "$simulator_id" ]]; then
            echo "No bootable iPhone simulator is currently installed; downloading the default iOS runtime for the pinned Xcode."
            xcodebuild -downloadPlatform iOS
            xcrun simctl list devices available >"$RUNNER_TEMP/available-simulators.txt"
            cat "$RUNNER_TEMP/available-simulators.txt"
            simulator_id="$(grep -m1 -E 'iPhone .*[0-9A-Fa-f-]{36}' "$RUNNER_TEMP/available-simulators.txt" | grep -oE '[0-9A-Fa-f-]{36}' | head -1 || true)"
          fi

          if [[ -z "$simulator_id" ]]; then
            echo "No bootable iPhone simulator is available after runtime preparation." >&2
            exit 1
          fi

          echo "Using simulator $simulator_id"
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Test on iOS Simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project CharacterProfiler.xcodeproj \
            -scheme CharacterProfiler \
            -configuration Release \
            ENABLE_TESTABILITY=YES \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}" \
            -resultBundlePath "$RUNNER_TEMP/CharacterProfilerTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            test 2>&1 | tee "$RUNNER_TEMP/CharacterProfiler-xctest.log"

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CharacterProfiler-TestResults-${{ github.sha }}
          path: |
            ${{ runner.temp }}/CharacterProfiler-xctest.log
            ${{ runner.temp }}/CharacterProfilerTests.xcresult
          if-no-files-found: warn
          retention-days: 7

      - name: Build optimized iPhoneOS Release
        run: >-
          xcodebuild
          -project CharacterProfiler.xcodeproj
          -scheme CharacterProfiler
          -configuration Release
          -sdk iphoneos
          -destination "generic/platform=iOS"
          -derivedDataPath "$RUNNER_TEMP/CharacterProfilerDerivedData"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_STRICT_CONCURRENCY=complete
          build

      - name: Validate compiled icon and package the qualified device build
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/CharacterProfilerDerivedData/Build/Products/Release-iphoneos/CharacterProfiler.app"
          test -d "$app"
          python3 .github/scripts/validate_compiled_icon.py \
            CharacterProfiler/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png \
            "$app/AppIcon60x60@2x.png"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")
          expected_version=$(awk -F= '/^MARKETING_VERSION[[:space:]]*=/ {gsub(/[[:space:]]/,"",$2); print $2}' ProjectVersion.xcconfig)
          expected_build=$(awk -F= '/^CURRENT_PROJECT_VERSION[[:space:]]*=/ {gsub(/[[:space:]]/,"",$2); print $2}' ProjectVersion.xcconfig)
          test "$version" = "$expected_version"
          test "$build" = "$expected_build"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$build" =~ ^[1-9][0-9]*$ ]]
          package="$RUNNER_TEMP/CharacterProfiler-package"
          output="$GITHUB_WORKSPACE/artifacts"
          rm -rf "$package" "$output"
          mkdir -p "$package/Payload" "$output"
          ditto "$app" "$package/Payload/CharacterProfiler.app"
          (cd "$package" && /usr/bin/zip -qry "$output/CharacterProfiler-$version-unsigned.ipa" Payload)
          printf '%s\n' "$GITHUB_SHA" > "$output/SOURCE_COMMIT"
          printf '%s\n' "$version" > "$output/RELEASE_VERSION"
          printf '%s\n' "$build" > "$output/BUILD_NUMBER"
          (
            cd "$output"
            shasum -a 256 "CharacterProfiler-$version-unsigned.ipa" > "CharacterProfiler-$version-unsigned.ipa.sha256"
            shasum -a 256 *.ipa *.ipa.sha256 SOURCE_COMMIT RELEASE_VERSION BUILD_NUMBER > SHA256SUMS.txt
            shasum -a 256 -c SHA256SUMS.txt
          )

      - name: Upload IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CharacterProfiler-IPA-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
