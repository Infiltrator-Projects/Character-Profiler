# SPDX-License-Identifier: GPL-3.0-or-later
name: Publish release
on:
  workflow_run:
    workflows: ["iOS Build"]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: character-profiler-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: CharacterProfiler-IPA-${{ github.event.workflow_run.head_sha }}
          path: qualified
      - name: Verify and promote the exact qualified IPA
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA" || exit 0
          test "$(cat qualified/SOURCE_COMMIT)" = "$EXPECTED_SHA"
          (cd qualified && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          import pathlib, plistlib, re, zipfile
          root = pathlib.Path("qualified")
          values = {}
          for line in pathlib.Path("ProjectVersion.xcconfig").read_text().splitlines():
              if "=" in line and not line.lstrip().startswith("//"):
                  key, value = line.split("=", 1)
                  values[key.strip()] = value.strip()
          version = (root / "RELEASE_VERSION").read_text().strip()
          build = (root / "BUILD_NUMBER").read_text().strip()
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version)
          assert re.fullmatch(r"[1-9][0-9]*", build)
          assert version == values["MARKETING_VERSION"]
          assert build == values["CURRENT_PROJECT_VERSION"]
          with zipfile.ZipFile(root / ("CharacterProfiler-" + version + "-unsigned.ipa")) as archive:
              info = plistlib.loads(archive.read("Payload/CharacterProfiler.app/Info.plist"))
              assert info["CFBundleShortVersionString"] == version
              assert str(info["CFBundleVersion"]) == build
              assert archive.getinfo("Payload/CharacterProfiler.app/" + info["CFBundleExecutable"]).file_size > 0
          PY
          version=$(cat qualified/RELEASE_VERSION)
          tag="v$version"
          ipa="CharacterProfiler-$version-unsigned.ipa"
          mkdir release
          cp "qualified/$ipa" "qualified/$ipa.sha256" release/
          if git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null; then
            if [[ "$(git rev-parse "$tag^{commit}")" != "$EXPECTED_SHA" ]]; then
              gh release view "$tag" --json isDraft --jq .isDraft | grep -qx false
              echo "$tag already identifies an immutable release."
              exit 0
            fi
          fi
          if ! gh release view "$tag" --json isDraft,targetCommitish > "$RUNNER_TEMP/release-state"; then
            gh release create "$tag" --target "$EXPECTED_SHA" --draft \
              --title "Character Manager $version" --generate-notes
            gh release view "$tag" --json isDraft,targetCommitish > "$RUNNER_TEMP/release-state"
          fi
          test "$(jq -r .targetCommitish "$RUNNER_TEMP/release-state")" = "$EXPECTED_SHA"
          draft=$(jq -r .isDraft "$RUNNER_TEMP/release-state")
          # Draft repair is separate from immutable public release verification.
          if [[ "$draft" == true ]]; then
            gh release upload "$tag" release/* --clobber
          fi
          verify_remote() {
            local destination
            destination=$(mktemp -d)
            gh release download "$tag" --dir "$destination"
            diff -qr release "$destination"
            rm -rf "$destination"
          }
          verify_remote
          if [[ "$draft" == true ]]; then
            gh release edit "$tag" --draft=false --latest
          fi
          verify_remote
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git rev-parse "$tag^{commit}")" = "$EXPECTED_SHA"
